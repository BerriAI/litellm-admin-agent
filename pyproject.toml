[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "litellm-admin-agent"
version = "0.2.0"
description = "LiteLLM Enterprise administration from Slack"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dynamic = ["dependencies"]

[project.scripts]
litellm-admin-agent = "litellm_admin_agent.app:cli"

[tool.setuptools]
packages = ["litellm_admin_agent"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.in"]}

[tool.setuptools.package-data]
litellm_admin_agent = ["connect.js"]
