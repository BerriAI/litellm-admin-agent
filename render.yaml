services:
  - type: web
    name: litellm-admin-agent
    runtime: python
    plan: starter
    region: oregon
    numInstances: 1
    buildCommand: pip install --require-hashes -r requirements.txt
    startCommand: python app.py --web
    healthCheckPath: /readyz
    autoDeployTrigger: off
    disk:
      name: admin-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: OPENAI_AGENTS_DISABLE_TRACING
        value: '1'
      - key: STATE_DB
        value: /var/data/events.sqlite3
      - key: SLACK_WORKSPACE_ID
        sync: false
      - key: SLACK_ENABLED
        value: 'true'
      - key: LITELLM_BASE_URL
        sync: false
      - key: LITELLM_MODEL
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
      - key: LITELLM_MCP_ALIAS
        value: personal_admin
      - key: CONNECTION_AUTH_MODE
        # Choose api_key or sso at creation; keep that choice on later syncs.
        sync: false
      - key: ADMIN_READ_ONLY
        value: 'false'
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_TOOL_NAMES
        sync: false
      - key: ADMIN_AGENT_SERVICE_TOKEN
        generateValue: true
